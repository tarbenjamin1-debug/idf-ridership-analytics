name: dbt CI

on:
  push:
    paths:
      - "dbt/idf_transport/**"
      - ".github/workflows/dbt-ci.yml"
  pull_request:
    paths:
      - "dbt/idf_transport/**"

jobs:
  dbt-validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt/idf_transport

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      - name: Install dbt packages
        run: dbt deps

      - name: Parse dbt project
        run: dbt parse
